<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트 기초</title>
</head>
<body>
    <script>
        console.log(Math.ceil(5.33)); // 올림 6
        console.log(Math.floor(5.33)); // 내림 5
        console.log(Math.round(5.33)); // 반올림 6
        console.log(Math.pow(2, 3)); // 2의 3제곱 계산
        console.log(Math.sqrt(100)); // 루트 계산
        console.log(Math.abs(-30)); // 절대값(-날아감) 계산
        console.log(Math.max(1, 2, 3)); // 여러수 중 가장 큰 수 반환
        console.log(Math.min(1, 2, 3)); // 여러수 중 가장 작은 수 반환
        console.log(Math.random()); // 0보다 크고 1보다 작은 랜덤한 소수 반환
        console.log(Math.round(Math.random()*44)); // 45개의 로또 번호 계산 - 44를 만들고 반올림을 통해서 0.xxxx를 올려서 45까지를 만든다 
        console.log(Math.round((Math.random()*23498239048)%45+1)); // 혹은 큰 수를 곱해서 일반수로 만들고 %45 나머지로 45개의 경우를 만들고 0이 아니라 +1을 해서 1부터 시작되게 만들면 된다       
        console.log(3.14159.toFixed(3)); // 숫자의 자릿수만큼 끊어서 반환 . 미포함
        console.log(String(Math.random()).length); 
    </script>
</body>
</html>
