<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열</title>
</head>
<body>
    <h1>배열 - array</h1>
    <p>연관된 데이터들을 모아놓은 집합</p>
    <p>배열은 ,(콤마)로 구분하여 원소를 여러개 입력할 수 있다.</p>
    <p>배열은 순번이라는 개념이 있다.(먼저 저장된 순서 -> 0부터 카운팅)</p>
    <script>
        let a = [1, 3, 4, '안녕', 66][1]; // 3 - 앞뒤로 대괄호를 사용해야 함
        a[2] // 인덱스 괄호
        '문자열'[2] // 문자'열'이기에 인덱스로도 가져올 수 있다  
        // a[3][1] // '녕'

        let fruits = ['멜론', '수박', '복숭아', '자두', '골드키위', '참외']; // 선생님이 좋아하시는 안 신 과일들
        console.log(fruits);
    
        // 코드 직접 접근 권한이 없을 경우 배열 삭제 방법
        // 배열 관련 함수 소개
        fruits.pop(); // 맨 끝의 데이터 하나를 지울 때 사용하는 함수
        console.log(fruits);
        fruits.push('바나나'); // 데이터 하나를 추가할 때 사용하는 함수
        console.log(fruits);
        console.log(fruits.length); // 배열 원소의 개수를 계산한다 6
        fruits.splice(2, 1); // 지움 시작 index, 지울 개수 
        fruits.splice(2, 2, '샤인머스캣', '포도'); // 지움 시작 index, 지울 개수, '추가할 데이터'[,]
        console.log(fruits);

        let classmate = [
            '유채린',
            '배수정',
            '최윤성',
            '최선미',
            '김가온',
        ];
        let newClass = [...classMate, '안정현', '윤희정']; // ...classMate라는 변수를 가져오고, 두 개의 요소를 추가해서 새로운 배열을 만드는 문법이다
        let newClass2 = ['윤희정', ...classMate, '안정현']; // 맨 앞에 배열 요소를 추가하는 것도 가능하다
        </script>
</body>
</html>
