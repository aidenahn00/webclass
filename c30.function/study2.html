        // 사물 -> 객체
        let fan = {
            body : '검은색',
            height : 120,
            width : 30,
            weight : '6kg',
            fanSpeed : 0,
            powerOn : function() {
                alert('선풍기 전원이 켜졌습니다.');
                this.fanSpeed = 1;
            },
            poswerOff : function() {
                alert('선풍기 전원이 꺼졌습니다.');
                this.fanSpeed = 0;
            },
            fanSpeedUp : function() {
                // 이 선풍기의 펜스피드를 올리는 기능
                this.fanSpeed += 1;
            },
            fanSpeedDown : function() {
                // 이 선풍기의 펜스피드를 올리는 기능
                this.fanSpeed -= 1;
            },
            showFanSpeed : function() {
                alert(`현재 선풍기 속도는 ${this.fanSpeed}입니다.`);
            },
        }

        fan.powerOn();
        fan.showFanSpeed();      
        fan.fanSpeedUp();
        fan.fanSpeedUp();
        fan.showFanSpeed();
