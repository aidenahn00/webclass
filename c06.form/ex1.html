<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예제</title>
</head>
<body>
    <h1>CREATE YOUR ACCOUNT</h1>
    <form action="#">
        <div>
            <label for="email">Email Address</label>
            <input type="text" id="email" name="email">
        </div>
        <div>
            <label for="email-confim">Confirm your Address</label>
            <input type="text" id="email-confim" name="emailConfirm">
        </div>
        <div>
            <label for="select-box">Country of Residence</label>
            <select name="selectBox" id="select-box">
                <option value="alandIslands">Aland Islands</option>
                <option value="bahamas">Bahamas</option>
                <option value="china">China</option>
                <option value="denmark">Denmark</option>
                <option value="egypt">Egypt</option>
                <option value="france">France</option>
                <option value="unitedKingdom">United Kingdom</option>
                <option value="koreaRepublicOf" selected>Korea, Republic of</option>
            </select>
        </div>
        <div>
            <input type="checkbox" id="agree" name="agree">
            <label for="agree">
            I am 13 years of age or older and agree to the terms of the <i>Steam Subscriber Agreement</i> and the <i>Valve Privacy Policy.</i>
            </label>
        </div>
        <button type="submit">Continue</button>
    </form>
</body>
</html>
