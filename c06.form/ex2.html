<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예시</title>
</head>
<body>
    <h1>로그인</h1>
    <h2>Wavve 계정으로 로그인</h2>
    <form action="#">
        <div>
            <label for="id-input">이메일 주소 또는 아이디</label>
            <input type="text" id="id-input" placeholder="이메일 주소 또는 아이디" name="idInput">
        </div>
        <div>
            <label for="password">비밀번호</label>
            <input type="password" id="password" placeholder="비밀번호" name="password">
        </div>
        <div>
            <input type="checkbox" id="id-save" name="idSave">
            <label for="id-save">아이디 저장</label>
            <input type="checkbox" id="login-auto" name="loginAuto">
            <label for="login-auto">자동 로그인</label>
        </div>
        <button type="submit">로그인</button>
    </form>
    <div>
        <ul>
            <li><a href="#">아이디 찾기</a></li>
            <li><a href="#">비밀번호 재설정</a></li>
            <li><a href="#">회원가입</a></li>
        </ul>
    </div>
    <div>
        <h2>또는 다른 서비스 계정으로 로그인</h2>
        <ul>
            <li>
                <a href="#" target="_blank">
                    <img src="./img/ico-common-kakao.png" alt="카카오톡로그인아이콘">
                </a>
            </li>
            <li>
                <a href="#" target="_blank">
                    <img src="./img/ico-common-tworld.png" alt="티월드로그인아이콘">
                </a>
            </li>
            <li>
                <a href="#" target="_blank">
                    <img src="./img/ico-common-naver.png" alt="네이버로그인아이콘">
                </a>
            </li>
            <li>
                <a href="#" target="_blank">
                    <img src="./img/ico-common-facebook.png" alt="페이스북로그인아이콘">
                </a>
            </li>
            <li>
                <a href="#" target="_blank">
                    <img src="./img/ico-common-apple.png" alt="애플로그인아이콘">
                </a>
            </li>
        </ul>
        
    </div>
    <div>
        <p>* SNS계정으로 간편하게 가입하여 서비스를 이용하실 수 있습니다.<br>기존 POOQ 계정 또는 Wavve 계정과는 연동되지 않으니 이용에 참고하세요.</p>
    </div>
</body>
</html>
