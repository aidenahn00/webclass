<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날짜객체</title>
</head>
<body>
    <h1>date객체</h1>
    <p>date객체를 통하여 날짜 정보를 가져올 수 있다</p>
    <h2 class="time-frame"></h2>
    <script>
            let today = new Date();
            let year = today.getFullYear();
            let month = today.getMonth()+1;
            let date = today.getDate();
            let dayList = ['일', '월', '화', '수', '목', '금', '토'];
            let day = dayList[today.getDay()];
            let secondes = today.getSeconds();
            let minutes = today.getMinutes();
            let hours = today.getHours();
            document.querySelector('.time-frame').innerHTML = `현재는 ${year}년 ${month}월 ${date}일 (${day}) ${hours}시 ${minutes}분 ${secondes}초입니다.`;
        setInterval(()=>{
            let today = new Date();
            let year = today.getFullYear();
            let month = today.getMonth()+1;
            let date = today.getDate();
            let dayList = ['일', '월', '화', '수', '목', '금', '토'];
            let day = dayList[today.getDay()];
            let secondes = today.getSeconds();
            let minutes = today.getMinutes();
            let hours = today.getHours();
            document.querySelector('.time-frame').innerHTML = `현재는 ${year}년 ${month}월 ${date}일 (${day}) ${hours}시 ${minutes}분 ${secondes}초입니다.`;
        }, 1000);
    </script>
</body>
</html>
