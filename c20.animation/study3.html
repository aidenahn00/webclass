<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가로 무한 마키 애니메이션</title>
    <link rel="stylesheet" href="./css/study3.css">
</head>
<body>
    <main class="marquee-page">
        <h1>Infinite Marquee</h1>
        <div class="marquee" aria-label="공지 사항">
            <div class="marquee-track">
                <div class="marquee-content">
                    <span>✦ CSS ANIMATION</span>
                    <span>가로 방향으로 끝없이 흐르는 마키</span>
                    <span>✦ INFINITE SCROLL</span>
                    <span>동일한 콘텐츠를 이어 끊김 없이 반복합니다</span>
                </div>
                <div class="marquee-content" aria-hidden="true">
                    <span>✦ CSS ANIMATION</span>
                    <span>가로 방향으로 끝없이 흐르는 마키</span>
                    <span>✦ INFINITE SCROLL</span>
                    <span>동일한 콘텐츠를 이어 끊김 없이 반복합니다</span>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
